[package]
name = "adu-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Chicago ADU preapproval monitor with a durable, reviewable social outbox"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
httpdate = "1"
rand = "0.9"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
toml = "0.9"
unicode-segmentation = "1"
ureq = { version = "3.4", features = ["json"] }
url = "2"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["functions"] }
tempfile = "3"
tiny_http = "0.12"

[profile.release]
lto = "thin"
strip = true
